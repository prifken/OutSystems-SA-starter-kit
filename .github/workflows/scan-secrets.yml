name: Secret Scan

# Runs scripts/scan-secrets.js on every PR, regardless of which files
# changed — a leaked credential can show up anywhere in a diff, not just
# in components/ or scripts/ (which is all golden-fixture.yml watches).
# Deliberately its own workflow, not folded into golden-fixture.yml's
# path-filtered trigger, so it can't be skipped by scoping a PR to files
# outside that filter. No Playwright/browser install needed, so this
# stays fast regardless of what else runs.

on:
  pull_request:

jobs:
  scan-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Scan for secrets
        working-directory: scripts
        run: node scan-secrets.js
