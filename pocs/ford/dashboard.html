<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Supplier Dashboard | Ford Supplier Quality Portal</title>
<!--
  Ford Motor Company — Supplier Quality Portal, Screen 1 of 2.
  Everything here is composed from ../../components/ — nothing custom
  is invented in this file. Copied from examples/os-ticketing/dashboard.html
  per the README's "How to Build a New Prototype" recipe.
-->
<link rel="stylesheet" href="../../components/tokens.css">
</head>
<body>
  <div class="layout">

    <os-sidebar-nav active="dashboard" logo="ford-logo.png" brand="Ford Motor Company" home-href="dashboard.html">
      <a href="dashboard.html" data-nav="dashboard" data-icon="grid">Dashboard</a>
      <a href="dashboard.html" data-nav="suppliers" data-icon="briefcase">Suppliers</a>
      <a href="#" data-nav="reports" data-icon="bar-chart">Reports</a>
      <a href="#" data-nav="settings" data-icon="settings">Settings</a>
    </os-sidebar-nav>

    <main class="main-content">
      <header class="header">
        <div class="header-left">
          <div>
            <h1 class="header-title">Supplier Dashboard</h1>
            <p class="header-subtitle">Quality &amp; delivery performance across active suppliers</p>
          </div>
        </div>
        <div class="header-actions">
          <div class="avatar">JD</div>
        </div>
      </header>

      <div class="page">

        <!-- KPI row -->
        <div class="grid-4 mb-m">
          <os-kpi-card label="Active Suppliers" value="312" variant="primary" sub="Across 4 regions"></os-kpi-card>
          <os-kpi-card label="At-Risk Suppliers" value="9" variant="warning" sub="Flagged this quarter"></os-kpi-card>
          <os-kpi-card label="Avg On-Time Delivery" value="96.1%" variant="primary" sub="Last 90 days" trend="up" trend-value="+0.8pt"></os-kpi-card>
          <os-kpi-card label="Open Corrective Actions" value="14" variant="warning" sub="vs. last quarter" trend="down" trend-value="-3"></os-kpi-card>
        </div>

        <!-- Search + filter -->
        <div class="mb-base">
          <os-search-filter-bar id="filterBar" placeholder="Search by supplier or commodity...">
            <select class="form-control" id="riskFilter">
              <option value="">All Risk Levels</option>
              <option value="Low">Low</option>
              <option value="Watch">Watch</option>
              <option value="At Risk">At Risk</option>
            </select>
          </os-search-filter-bar>
        </div>

        <!-- Supplier table -->
        <os-card heading="Suppliers" action-label="Export" action-href="#">
          <os-data-table id="suppliersTable" row-href-template="supplier-detail.html?id={id}" clickable empty-text="No suppliers match your filters."></os-data-table>
        </os-card>

      </div>
    </main>
  </div>

  <!--
    Loaded at the end of body, not in <head> — required so light-DOM
    children exist before components upgrade. See CLAUDE.md "Script
    Placement" section before moving this.
  -->
  <script src="../../components/os-components.js"></script>
  <script>
    // Fictional supplier data for this prototype. In a real POC this would
    // come from an ODC REST API — see patterns/odc-api-wiring/ in the
    // source SA toolkit this kit was distilled from.
    const SUPPLIERS = [
      { id: "MST-2201", name: "Meridian Stamping & Tool", region: "Michigan, US", commodity: "Stamped Body Panels", onTime: "97.8%", ppm: "22", risk: "Low", riskVariant: "success", lastAudit: "Jun 3, 2026" },
      { id: "HPC-3387", name: "Highline Precision Components", region: "Ontario, CA", commodity: "Machined Powertrain Parts", onTime: "94.1%", ppm: "41", risk: "Low", riskVariant: "success", lastAudit: "May 18, 2026" },
      { id: "DHS-4471", name: "Delta Harness Systems", region: "Puebla, MX", commodity: "Wiring Harnesses", onTime: "88.4%", ppm: "187", risk: "At Risk", riskVariant: "error", lastAudit: "Apr 22, 2026" },
      { id: "VPG-1094", name: "Vantage Polymer Group", region: "Ohio, US", commodity: "Injection-Molded Interior Trim", onTime: "95.6%", ppm: "33", risk: "Low", riskVariant: "success", lastAudit: "Jun 10, 2026" },
      { id: "ICC-5528", name: "Ironclad Castings Co.", region: "Indiana, US", commodity: "Engine Block Castings", onTime: "91.2%", ppm: "96", risk: "Watch", riskVariant: "warning", lastAudit: "Mar 29, 2026" },
      { id: "SFS-6612", name: "Sunbelt Fastener Supply", region: "Guanajuato, MX", commodity: "Fasteners & Hardware", onTime: "99.1%", ppm: "8", risk: "Low", riskVariant: "success", lastAudit: "Jun 14, 2026" }
    ];

    const table = document.getElementById("suppliersTable");
    table.columns = [
      { key: "name", label: "Supplier" },
      { key: "region", label: "Region" },
      { key: "commodity", label: "Commodity" },
      { key: "onTime", label: "On-Time" },
      { key: "ppm", label: "Quality (PPM)" },
      { key: "risk", label: "Risk", type: "status" },
      { key: "lastAudit", label: "Last Audit" }
    ];

    let searchValue = "";
    let riskValue = "";

    function applyFilters() {
      const q = searchValue.trim().toLowerCase();
      table.rows = SUPPLIERS.filter((s) => {
        const matchesSearch = !q || s.name.toLowerCase().includes(q) || s.commodity.toLowerCase().includes(q);
        const matchesRisk = !riskValue || s.risk === riskValue;
        return matchesSearch && matchesRisk;
      });
    }

    applyFilters();

    document.getElementById("filterBar").addEventListener("os-search", (e) => {
      searchValue = e.detail.value;
      applyFilters();
    });

    document.getElementById("riskFilter").addEventListener("change", (e) => {
      riskValue = e.target.value;
      applyFilters();
    });
  </script>
</body>
</html>
